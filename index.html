<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>认知情绪调节方式测试 | CERQ-SF 专业量表</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei",sans-serif}
        body{background:#f7f8fa;padding:30px 20px}
        .container{max-width:700px;margin:0 auto;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
        .title{font-size:24px;font-weight:bold;margin-bottom:10px;color:#222}
        .subtitle{font-size:16px;color:#666;margin-bottom:30px}
        .desc{line-height:1.7;color:#444;margin-bottom:25px}
        .question{margin:20px 0;font-size:15px;color:#222}
        .options{display:flex;gap:12px;margin:10px 0 30px 0}
        .option{flex:1;padding:10px;text-align:center;border:1px solid #ddd;border-radius:8px;cursor:pointer}
        .option:hover{background:#eef7ff;border-color:#409eff}
        .option.active{background:#409eff;color:white}
        .btn{background:#409eff;color:white;border:none;padding:14px 30px;border-radius:10px;font-size:16px;margin-top:20px;cursor:pointer;width:100%}
        .btn:hover{background:#338eef}
        .result{margin-top:40px;padding:25px;background:#f0f9ff;border-radius:12px;display:none}
        .result h3{margin-bottom:15px;color:#222}
        .result p{line-height:1.8;margin-bottom:10px;color:#333}
    </style>
</head>
<body>
    <div class="container">
        <div class="title">测测你应对事情的方式</div>
        <div class="subtitle">专业认知情绪调节测试（CERQ-SF 简版）</div>
        <div class="desc">
            每个人遇到烦心事时，都会有不同的思考方式。<br>
            这个测试能帮你了解：<strong>你最习惯用什么方式面对负面情绪？</strong><br>
            你的调节方式是<strong>适应性</strong>（健康）还是<strong>非适应性</strong>（内耗）？<br>
            答案没有对错，请按真实想法选择。
        </div>

        <div id="questions"></div>
        <button class="btn" onclick="getResult()">查看我的结果</button>

        <div class="result" id="result">
            <h3>📊 你的测试结果</h3>
            <p id="r1"></p>
            <p id="r2"></p>
            <p id="r3"></p>
            <p id="r4"></p>
        </div>
    </div>

    <script>
        const questions = [
            "1. 我认为自己应该对所发生的事负责。",
            "2. 总体而言，我认为结果是由我造成的。",
            "3. 我认为自己必须接受既成的事实。",
            "4. 我认为自己必须接受当下的现状。",
            "5. 我常常思考过往经历中自己的感受。",
            "6. 过往经历中的思绪和感受常令我心事重重。",
            "7. 我会回想与当下无关的愉快往事。",
            "8. 我会多想积极的事，而非眼前发生的事情。",
            "9. 我会思考如何改变现状。",
            "10. 我会思考最优的应对方案。",
            "11. 我认为可以从当下的状况中有所收获。",
            "12. 我认为事情的结果能让我变成更强的人。",
            "13. 相较其他事，我认为这件事并不算糟糕。",
            "14. 我会告诉自己，生活中还有更不如意的事情。",
            "15. 我反复回想我经历的事情有多么糟糕。",
            "16. 我会不断思考当时的状况有多么糟糕。",
            "17. 我认为他人应该对所发生的事情负责。",
            "18. 总体而言，我认为结果是他人导致的。"
        ];

        const labels = ["几乎从不", "偶尔", "有时", "经常", "几乎总是"];
        let answers = Array(18).fill(null);

        const qContainer = document.getElementById("questions");
        questions.forEach((q, idx) => {
            const div = document.createElement("div");
            div.innerHTML = `
                <div class="question">${q}</div>
                <div class="options">
                    ${labels.map((l,i)=>`
                        <div class="option" onclick="select(${idx},${i+1})">${i+1}<br>${l}</div>
                    `).join('')}
                </div>
            `;
            qContainer.appendChild(div);
        });

        function select(qIdx, val) {
            answers[qIdx] = val;
            const opts = document.querySelectorAll(".options")[qIdx].querySelectorAll(".option");
            opts.forEach(o=>o.classList.remove("active"));
            opts[val-1].classList.add("active");
        }

        function getResult() {
            if(answers.includes(null)){alert("请完成所有题目");return}
            
            const selfBlame = answers[0]+answers[1];
            const accept = answers[2]+answers[3];
            const rumination = answers[4]+answers[5];
            const positiveFocus = answers[6]+answers[7];
            const plan = answers[8]+answers[9];
            const positiveReapp = answers[10]+answers[11];
            const perspective = answers[12]+answers[13];
            const catastrophe = answers[14]+answers[15];
            const otherBlame = answers[16]+answers[17];

            const adaptive = accept + positiveFocus + plan + positiveReapp + perspective;
            const nonAdaptive = selfBlame + rumination + catastrophe + otherBlame;

            let style = "";
            let max = Math.max(selfBlame,accept,rumination,positiveFocus,plan,positiveReapp,perspective,catastrophe,otherBlame);
            if(max===selfBlame) style="自我责备";
            else if(max===accept) style="接纳";
            else if(max===rumination) style="反刍思维";
            else if(max===positiveFocus) style="积极重聚焦";
            else if(max===plan) style="聚焦计划、解决问题";
            else if(max===positiveReapp) style="积极重评";
            else if(max===perspective) style="换位思考";
            else if(max===catastrophe) style="灾难化思维";
            else if(max===otherBlame) style="责备他人";

            let level = adaptive >= nonAdaptive ? "✅ 适应性（健康、成熟）" : "⚠️ 非适应性（容易内耗、焦虑）";

            document.getElementById("result").style.display = "block";
            document.getElementById("r1").innerHTML = "你最惯用的情绪调节方式：<strong>"+style+"</strong>";
            document.getElementById("r2").innerHTML = "整体调节风格：<strong>"+level+"</strong>";
            document.getElementById("r3").innerHTML = `适应性策略总分：${adaptive}（越高越健康）`;
            document.getElementById("r4").innerHTML = `非适应性策略总分：${nonAdaptive}（越低越稳定）`;

            // 自动输出答案（你可以复制去Excel）
            console.log("===== 受试者答案 =====");
            console.log(answers.join(","));
            console.log("维度得分：",selfBlame,accept,rumination,positiveFocus,plan,positiveReapp,perspective,catastrophe,otherBlame);
            console.log("适应/非适应：",adaptive,nonAdaptive);
        }
    </script>
</body>
</html>
