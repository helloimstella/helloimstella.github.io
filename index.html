<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测测你应对事情的方式</title>
<style>
    *{box-sizing:border-box}
    body{
        font-family:"微软雅黑",sans-serif;
        margin:0;
        background:linear-gradient(120deg,#fef5ff,#e8f4ff);
        color:#333;
        line-height:1.8;
    }
    .page{
        display:none;
        min-height:100vh;
        padding:30px 20px;
        max-width:720px;
        margin:0 auto;
    }
    .page.active{display:block}
    .intro-card{
        background:#fff;
        border-radius:20px;
        padding:50px 30px;
        box-shadow:0 8px 20px #00000015;
        text-align:center;
    }
    .intro-card h1{
        font-size:30px;
        color:#804fc1;
        margin-bottom:20px;
    }
    .intro-card p{
        font-size:17px;
        color:#555;
        margin:12px 0;
    }
    .btn{
        background:#804fc1;
        color:white;
        border:none;
        padding:15px 35px;
        border-radius:50px;
        font-size:17px;
        cursor:pointer;
        margin-top:30px;
        transition:all 0.3s;
    }
    .btn:hover{
        background:#6b3fa8;
        transform:translateY(-2px);
    }
    .q-card{
        background:white;
        border-radius:16px;
        padding:22px;
        margin-bottom:18px;
        box-shadow:0 4px 12px #00000010;
    }
    .q-text{
        font-size:16px;
        color:#222;
    }
    .opts{
        display:flex;
        justify-content:space-between;
        margin-top:15px;
        gap:6px;
        flex-wrap:wrap;
    }
    .opts label{
        background:#f3f0ff;
        padding:9px 12px;
        border-radius:8px;
        cursor:pointer;
        font-size:15px;
    }
    .opts input{display:none}
    .opts input:checked+label{
        background:#804fc1;
        color:white;
    }
    .res-card{
        background:white;
        border-radius:20px;
        padding:35px;
        box-shadow:0 8px 20px #00000015;
    }
    .main-result{
        background:linear-gradient(135deg,#804fc1,#a878e4);
        color:#fff;
        padding:25px;
        border-radius:16px;
        text-align:center;
        margin-bottom:25px;
    }
    .main-title{font-size:18px;opacity:0.9}
    .main-style{font-size:32px;font-weight:bold;margin:10px 0}
    .dim{
        background:#f9f5ff;
        padding:15px;
        border-radius:12px;
        margin:12px 0;
        font-size:16px;
    }
    .hover-item{
        position:relative;
        background:#f3f0ff;
        padding:14px 16px;
        border-radius:12px;
        margin:12px 0;
        cursor:pointer;
        font-size:16px;
        color:#333;
    }
    .hover-desc{
        display:none;
        position:absolute;
        left:105%;
        top:0;
        width:320px;
        background:#fff;
        color:#333;
        border:1px solid #eee;
        padding:18px;
        border-radius:12px;
        z-index:999;
        box-shadow:0 4px 20px rgba(0,0,0,0.15);
    }
    .hover-item:hover .hover-desc{display:block}
    h3{
        color:#804fc1;
        margin:30px 0 15px;
        font-size:19px;
    }
    hr{border:0;height:1px;background:#eee;margin:25px 0}
    .rich-desc{
        background:#f8f4ff;
        padding:20px;
        border-radius:12px;
        margin:20px 0;
        line-height:1.9;
    }
</style>
</head>
<body>

<!-- 引言页 -->
<div id="page1" class="page active">
    <div class="intro-card">
        <h1>✨ 测测你应对事情的方式 ✨</h1>
        <p>遇到压力、挫折或烦心事时，你习惯如何面对？</p>
        <p>有的人越挫越勇，有的人容易内耗纠结。</p>
        <p>这份测试将精准分析你的思维习惯与情绪应对风格。</p>
        <p>共 18 题｜约 3 分钟完成｜结果仅供个人参考</p>
        <button class="btn" onclick="goPage(2)">开始测试 →</button>
    </div>
</div>

<!-- 答题页 -->
<div id="page2" class="page">
    <h2 style="color:#804fc1;text-align:center;">请根据你的真实想法作答</h2>
    <p style="text-align:center;color:#666;margin-bottom:25px;">1=完全不符合  5=完全符合</p>
    <div id="questions"></div>
    <button class="btn" onclick="calcResult()">提交并查看结果</button>
</div>

<!-- 结果页 -->
<div id="page3" class="page">
    <div class="res-card">
        <div class="main-result">
            <div class="main-title">你最惯用的情绪应对方式</div>
            <div class="main-style" id="topStyleShow"></div>
            <div id="mainTypeShow"></div>
        </div>
        <div class="dim"><strong>整体调节风格：</strong><span id="totalType"></span></div>
        <div class="dim"><strong>积极性策略总分：</strong><span id="posScore"></span></div>
        <div class="dim"><strong>消极性策略总分：</strong><span id="negScore"></span></div>
        <div id="richExplain" class="rich-desc"></div>
        <hr>
        <h3>其他应对方式（共九种）</h3>
        <div id="allStyleList"></div>
    </div>
</div>

<script>
const items=[
    "我认为自己应该对所发生的事负责。",
    "总体而言，我认为结果是由我造成的。",
    "我认为自己必须接受既成的事实。",
    "我认为自己必须接受当下的现状。",
    "我常常思考过往经历中自己的感受。",
    "过往经历中的思绪和感受常令我心事重重。",
    "我会回想与当下无关的愉快往事。",
    "我会多想积极的事，而非眼前发生的事情。",
    "我会思考如何改变现状。",
    "我会思考最优的应对方案。",
    "我认为可以从当下的状况中有所收获。",
    "我认为事情的结果能让我变成更强的人。",
    "相较其他事，我认为这件事并不算糟糕。",
    "我会告诉自己，生活中还有更不如意的事情。",
    "我反复回想我经历的事情有多么糟糕。",
    "会不断思考当时的状况有多么糟糕。",
    "我认为他人应该对所发生的事情负责。",
    "总体而言，我认为结果是他人导致的。"
];

const dimInfo = [
    {
        name:"自我责备",type:"消极性",
        simple:"习惯将问题责任归于自己，容易内疚、自我怀疑。",
        rich:"你的核心思维特点是高度自省、习惯性揽责。遇到不顺时，你第一反应是「是我不够好」，容易陷入内疚、内耗。你心地善良、责任心极强，但常常过度消耗自己。建议：学会区分责任，不必事事苛责自己。"
    },{
        name:"接纳",type:"积极性",
        simple:"能够坦然接受现实，情绪稳定，不抗拒已发生的事。",
        rich:"你情绪稳定性非常高，面对挫折能平静接受，不抗拒、不崩溃。你心态成熟、包容度高，遇事冷静不情绪化，是人群中最沉稳的人。建议：接纳现实后再多一点主动改变，生活会更从容。"
    },{
        name:"反刍",type:"消极性",
        simple:"反复回想不愉快细节，容易钻牛角尖、陷入内耗。",
        rich:"你心思细腻、共情力强，但容易反复回想痛苦瞬间，越想越难受。事情早已过去，你的情绪却停在原地，长期易焦虑压抑。建议：学会转移注意力，不要给情绪反复折磨你的机会。"
    },{
        name:"积极重聚焦",type:"积极性",
        simple:"主动转移注意力，用开心事冲淡负面情绪。",
        rich:"你拥有很强的自愈能力，心情不好时会主动寻找快乐，不钻牛角尖。你通透、乐观，擅长自我调节，是最会自救的类型。建议：继续保持，搭配解决问题的思维会更优秀。"
    },{
        name:"聚焦计划",type:"积极性",
        simple:"冷静理性，优先思考解决方案，专注解决问题。",
        rich:"你是理性实干型人格，遇到问题不抱怨、不内耗，第一时间思考怎么解决。你逻辑清晰、抗压能力强，靠谱又成熟。建议：继续保持，适当允许自己有情绪，不用永远硬撑。"
    },{
        name:"积极重评",type:"积极性",
        simple:"从挫折中找成长、找意义，心态积极乐观。",
        rich:"你拥有稀缺的成长型思维，能从坏事里看到收获与蜕变。你内心强大、越挫越勇，心态好、运势佳。建议：坚持这种思维，人生会越走越宽。"
    },{
        name:"换位思考",type:"积极性",
        simple:"多角度看待事情，心态豁达，不易极端悲观。",
        rich:"你心胸开阔、心态成熟，不会放大痛苦，懂得自我开导。你情绪弹性大、自愈快，比同龄人更通透稳定。建议：保持豁达，同时重视自己的感受。"
    },{
        name:"灾难化",type:"消极性",
        simple:"把小事放大、过度悲观、想象最坏结果。",
        rich:"你属于高焦虑、多虑型，遇到小事容易脑补最坏结局，自己吓自己。你缺乏安全感，常因小事心神不宁。建议：拒绝过度脑补，理性评估现实。"
    },{
        name:"责备他人",type:"消极性",
        simple:"习惯归因外界与他人，容易抱怨、不满。",
        rich:"你自尊心强，遇到问题习惯向外找原因，不易自卑，但易抱怨、觉得自己是受害者。建议：适当自我反思，减少抱怨，关注可控部分。"
    }
];

const qEl=document.getElementById("questions");
items.forEach((txt,i)=>{
    const card=document.createElement("div");
    card.className="q-card";
    card.innerHTML=`<div class="q-text">${i+1}. ${txt}</div><div class="opts">${[1,2,3,4,5].map(n=>`<input type="radio" name="q${i}" value="${n}" id="q${i}${n}"><label for="q${i}${n}">${n}</label>`).join("")}</div>`;
    qEl.appendChild(card);
});

function goPage(n){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page"+n).classList.add("active");
}

function calcResult(){
    let totalPos=0,totalNeg=0;
    dimInfo.forEach(d=>d.score=0);
    for(let i=0;i<18;i++){
        const v=document.querySelector(`input[name="q${i}"]:checked`)?.value;
        if(!v)return alert("请完成所有题目！");
        dimInfo[Math.floor(i/2)].score+=parseInt(v);
    }
    dimInfo.forEach(d=>d.type==="积极性"?totalPos+=d.score:totalNeg+=d.score);
    const topDim=dimInfo.reduce((a,b)=>a.score>b.score?a:b);
    const topIndex=dimInfo.findIndex(x=>x.name===topDim.name);
    
    document.getElementById("topStyleShow").innerText=topDim.name;
    document.getElementById("mainTypeShow").innerText=topDim.type+"主导";
    document.getElementById("totalType").innerText=totalPos>totalNeg?"积极性为主，情绪调节能力良好":"消极性为主，容易产生情绪内耗";
    document.getElementById("posScore").innerText=totalPos;
    document.getElementById("negScore").innerText=totalNeg;
    document.getElementById("richExplain").innerHTML=`<strong>📝 专属深度解读</strong><br><br>${topDim.rich}`;
    
    let listHtml="";
    dimInfo.forEach((item,idx)=>{
        if(idx===topIndex){
            listHtml+=`<div class="hover-item">${item.name}（${item.type}）<div style="background:#f8f4ff;padding:15px;border-radius:10px;margin-top:10px;">${item.rich}</div></div>`;
        }else{
            listHtml+=`<div class="hover-item">${item.name}（${item.type}）<div class="hover-desc">${item.simple}</div></div>`;
        }
    });
    document.getElementById("allStyleList").innerHTML=listHtml;
    goPage(3);
}
</script>
</body>
</html>
