<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遇事心态自测</title>
<!-- 图表依赖 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- 撒花动画依赖 -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
        font-family:"微软雅黑",sans-serif;
        background:linear-gradient(120deg,#fef5ff,#e8f4ff);
        color:#333;
        line-height:1.8;
        padding-bottom:50px;
    }
    .page{
        display:none;
        min-height:100vh;
        padding:30px 20px;
        max-width:800px;
        margin:0 auto;
    }
    .page.active{display:block}

    /* 引言页 */
    .intro-card{
        background:#fff;
        border-radius:24px;
        padding:50px 35px;
        box-shadow:0 8px 30px rgba(0,0,0,0.08);
        text-align:center;
        margin-top:20px;
    }
    .intro-card h1{
        font-size:32px;
        color:#804fc1;
        margin-bottom:25px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
    }
    .intro-card h1::before, .intro-card h1::after{
        content:"✨";
        font-size:24px;
    }
    .intro-card p{
        font-size:17px;
        color:#555;
        margin:15px 0;
        line-height:1.8;
    }
    .intro-card .small-tip{
        font-size:12px;
        color:#999;
        margin-top:30px;
        padding-top:15px;
        border-top:1px solid #eee;
    }
    .btn{
        background:linear-gradient(135deg,#804fc1,#9c6ed8);
        color:white;
        border:none;
        padding:16px 40px;
        border-radius:50px;
        font-size:17px;
        cursor:pointer;
        margin-top:30px;
        transition:all 0.3s;
        box-shadow:0 4px 15px rgba(128,79,193,0.3);
    }
    .btn:hover{
        transform:translateY(-2px);
        box-shadow:0 6px 20px rgba(128,79,193,0.4);
    }

    /* 答题页 */
    .q-header{
        text-align:center;
        margin-bottom:30px;
    }
    .q-header h2{
        color:#804fc1;
        font-size:22px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
    }
    .q-header h2::before{
        content:"📝";
        font-size:20px;
    }
    .q-header p{
        color:#666;
        margin-top:10px;
    }
    .q-card{
        background:white;
        border-radius:18px;
        padding:25px;
        margin-bottom:20px;
        box-shadow:0 4px 15px rgba(0,0,0,0.05);
        transition:all 0.2s;
    }
    .q-card:hover{
        box-shadow:0 6px 20px rgba(0,0,0,0.08);
    }
    .q-text{
        font-size:16px;
        color:#222;
        line-height:1.7;
    }
    .opts{
        display:flex;
        justify-content:space-between;
        margin-top:18px;
        gap:8px;
        flex-wrap:wrap;
    }
    .opts label{
        background:#f3f0ff;
        padding:10px 15px;
        border-radius:10px;
        cursor:pointer;
        font-size:15px;
        flex:1;
        text-align:center;
        transition:all 0.2s;
    }
    .opts input{display:none}
    .opts input:checked+label{
        background:#804fc1;
        color:white;
    }

    /* 结果页整体样式 */
    .res-card{
        background:white;
        border-radius:24px;
        padding:40px 35px;
        box-shadow:0 8px 30px rgba(0,0,0,0.08);
        margin-top:20px;
    }
    .section-title{
        display:flex;
        align-items:center;
        gap:8px;
        font-size:20px;
        color:#804fc1;
        margin:40px 0 20px;
    }

    /* 核心结果区块 */
    .main-result{
        background:linear-gradient(135deg,#804fc1,#a878e4);
        color:#fff;
        padding:30px;
        border-radius:20px;
        text-align:center;
        margin-bottom:30px;
        box-shadow:0 6px 20px rgba(128,79,193,0.2);
        position:relative;
        overflow:hidden;
    }
    .main-result::before{
        content:"💫";
        position:absolute;
        top:15px;
        left:20px;
        font-size:28px;
        opacity:0.6;
    }
    .main-result::after{
        content:"💫";
        position:absolute;
        bottom:15px;
        right:20px;
        font-size:28px;
        opacity:0.6;
    }
    .main-title{
        font-size:19px;
        opacity:0.9;
        margin-bottom:10px;
    }
    .main-style{
        font-size:36px;
        font-weight:bold;
        margin:10px 0;
    }
    .main-tag{
        display:inline-block;
        background:rgba(255,255,255,0.2);
        padding:5px 15px;
        border-radius:20px;
        font-size:14px;
        margin-top:8px;
    }

    /* 基础数据行 */
    .data-row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:15px;
        margin:20px 0;
    }
    .dim{
        background:#f9f5ff;
        padding:18px;
        border-radius:15px;
        font-size:16px;
        display:flex;
        align-items:center;
        gap:10px;
    }
    .dim:nth-child(1)::before{content:"📈";font-size:18px;}
    .dim:nth-child(2)::before{content:"📉";font-size:18px;}
    .total-desc{
        background:#f9f5ff;
        padding:18px;
        border-radius:15px;
        font-size:16px;
        display:flex;
        align-items:center;
        gap:10px;
        margin:15px 0;
    }
    .total-desc::before{content:"📊";font-size:18px;}

    /* 雷达图区块 */
    .radar-container{
        background:#f9f5ff;
        padding:25px;
        border-radius:18px;
        margin:30px 0;
        text-align:center;
    }
    .radar-container h3{
        color:#804fc1;
        margin-bottom:20px;
        font-size:18px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
    }
    .radar-container h3::before{content:"🎯";}
    #radarChart{
        max-width:100%;
        height:400px;
        margin:0 auto;
    }

    /* 专属解读区块 */
    .rich-desc{
        background:#f8f4ff;
        padding:25px;
        border-radius:18px;
        margin:25px 0;
        line-height:1.9;
        border-left:4px solid #804fc1;
        position:relative;
    }
    .rich-desc strong{
        color:#804fc1;
        font-size:18px;
        display:block;
        margin-bottom:15px;
        display:flex;
        align-items:center;
        gap:8px;
    }
    .rich-desc strong::before{content:"💡";}

    /* 其他应对方式列表 */
    .hover-item{
        position:relative;
        background:#f3f0ff;
        padding:18px 20px;
        border-radius:15px;
        margin:15px 0;
        cursor:pointer;
        font-size:16px;
        color:#333;
        transition:all 0.2s;
        display:flex;
        align-items:center;
        gap:10px;
    }
    .hover-item::before{content:"🔹";font-size:16px;}
    .hover-item:hover{
        box-shadow:0 4px 15px rgba(0,0,0,0.05);
        transform:translateX(4px);
    }
    .hover-desc{
        display:none;
        position:absolute;
        left:105%;
        top:0;
        width:350px;
        background:#fff;
        color:#333;
        border:1px solid #eee;
        padding:20px;
        border-radius:15px;
        z-index:999;
        box-shadow:0 6px 20px rgba(0,0,0,0.1);
        line-height:1.7;
    }
    .hover-item:hover .hover-desc{display:block}

    hr{
        border:0;
        height:1px;
        background:#eee;
        margin:30px 0;
    }
</style>
</head>
<body>

<!-- 页面1：引言页 -->
<div id="page1" class="page active">
    <div class="intro-card">
        <h1>遇事心态自测</h1>
        <p>遇到压力、挫折或烦心事时，你习惯如何面对？</p>
        <p>有的人越挫越勇，有的人容易内耗纠结。</p>
        <p>这份测试将精准分析你遇到挫折时的思维习惯与情绪应对风格。</p>
        <p>共 18 题｜约 3 分钟完成｜结果仅供个人参考</p>
        <div class="small-tip">本测试采用CERQ-SF心理学量表，用科学的方式测量个体在遭遇负性生活事件时所采用的认知型情绪调节策略</div>
        <button class="btn" onclick="goPage(2)">开始测试 →</button>
    </div>
</div>

<!-- 页面2：答题页 -->
<div id="page2" class="page">
    <div class="q-header">
        <h2>请根据你的真实想法作答</h2>
        <p>1=完全不符合  2=比较不符合  3=一般  4=比较符合  5=完全符合</p>
    </div>
    <div id="questions"></div>
    <button class="btn" onclick="submitAndShowResult()">提交并查看结果</button>
</div>

<!-- 页面3：结果页 -->
<div id="page3" class="page">
    <div class="res-card">
        <!-- 核心结果 -->
        <div class="main-result">
            <div class="main-title">你最惯用的情绪应对方式</div>
            <div class="main-style" id="topStyleShow"></div>
            <div class="main-tag" id="mainTypeShow"></div>
        </div>

        <!-- 整体风格 & 分数 -->
        <div class="total-desc">
            <strong>整体调节风格：</strong><span id="totalType"></span>
        </div>
        <div class="data-row">
            <div class="dim"><strong>积极性策略总分：</strong><span id="posScore"></span></div>
            <div class="dim"><strong>消极性策略总分：</strong><span id="negScore"></span></div>
        </div>

        <!-- 雷达图 -->
        <div class="radar-container">
            <h3>你的情绪调节维度总览</h3>
            <canvas id="radarChart"></canvas>
        </div>

        <!-- 专属深度解读 -->
        <div id="richExplain" class="rich-desc"></div>

        <hr>

        <!-- 其他应对方式 -->
        <h3 class="section-title">📚 其他应对方式（共九种）</h3>
        <div id="allStyleList"></div>
    </div>
</div>

<script>
// 题目列表
const items=[
    "我认为自己应该对所发生的事负责。",
    "总体而言，我认为结果是由我造成的。",
    "我认为自己必须接受既成的事实。",
    "我认为自己必须接受当下的现状。",
    "我常常思考过往经历中自己的感受。",
    "过往经历中的思绪和感受常令我心事重重。",
    "我会回想与当下无关的愉快往事。",
    "我会多想积极的事，而非眼前发生的事情。",
    "我会思考如何改变现状。",
    "我会思考最优的应对方案。",
    "我认为可以从当下的状况中有所收获。",
    "我认为事情的结果能让我变成更强的人。",
    "相较其他事，我认为这件事并不算糟糕。",
    "我会告诉自己，生活中还有更不如意的事情。",
    "我反复回想我经历的事情有多么糟糕。",
    "会不断思考当时的状况有多么糟糕。",
    "我认为他人应该对所发生的事情负责。",
    "总体而言，我认为结果是他人导致的。"
];

// 维度信息
const dimInfo = [
    {
        name:"自我责备",type:"消极性",
        simple:"习惯将问题责任归于自己，容易内疚、自我怀疑。",
        rich:"你的核心思维特点是高度自省、习惯性揽责。遇到不顺时，你第一反应是「是我不够好」，容易陷入内疚、内耗。你心地善良、责任心极强，但常常过度消耗自己。建议：学会区分责任，不必事事苛责自己。"
    },{
        name:"接纳",type:"积极性",
        simple:"能够坦然接受现实，情绪稳定，不抗拒已发生的事。",
        rich:"✨ 你的情绪稳定性堪称「天花板」<br><br>面对挫折、遗憾、不如意，你从不会疯狂抗拒或崩溃逃避，而是能以成熟的心态平静接受事实。你深知「木已成舟」的道理，与其纠结内耗，不如坦然接纳，这种特质让你比80%的人都更不容易焦虑。<br><br>🌰 场景例子：工作出错被批评，别人会陷入自责或抱怨，但你会先接受「已经做错」的事实，再冷静想办法补救，不会被情绪裹挟。<br><br>💡 专属建议：你的接纳力是非常珍贵的优势，但接纳不代表躺平。可以在接受现实的基础上，多一点主动改变的行动力，你的生活状态会更从容、更有掌控感。"
    },{
        name:"反刍",type:"消极性",
        simple:"反复回想不愉快细节，容易钻牛角尖、陷入内耗。",
        rich:"你心思细腻、共情力强，但容易反复回想痛苦瞬间，越想越难受。事情早已过去，你的情绪却停在原地，长期易焦虑压抑。建议：学会转移注意力，不要给情绪反复折磨你的机会。"
    },{
        name:"积极重聚焦",type:"积极性",
        simple:"主动转移注意力，用开心事冲淡负面情绪。",
        rich:"你拥有很强的自愈能力，心情不好时会主动寻找快乐，不钻牛角尖。你通透、乐观，擅长自我调节，是最会自救的类型。建议：继续保持，搭配解决问题的思维会更优秀。"
    },{
        name:"聚焦计划",type:"积极性",
        simple:"冷静理性，优先思考解决方案，专注解决问题。",
        rich:"你是理性实干型人格，遇到问题不抱怨、不内耗，第一时间思考怎么解决。你逻辑清晰、抗压能力强，靠谱又成熟。建议：继续保持，适当允许自己有情绪，不用永远硬撑。"
    },{
        name:"积极重评",type:"积极性",
        simple:"从挫折中找成长、找意义，心态积极乐观。",
        rich:"你拥有稀缺的成长型思维，能从坏事里看到收获与蜕变。你内心强大、越挫越勇，心态好、运势佳。建议：坚持这种思维，人生会越走越宽。"
    },{
        name:"换位思考",type:"积极性",
        simple:"多角度看待事情，心态豁达，不易极端悲观。",
        rich:"你心胸开阔、心态成熟，不会放大痛苦，懂得自我开导。你情绪弹性大、自愈快，比同龄人更通透稳定。建议：保持豁达，同时重视自己的感受。"
    },{
        name:"灾难化",type:"消极性",
        simple:"把小事放大、过度悲观、想象最坏结果。",
        rich:"你属于高焦虑、多虑型，遇到小事容易脑补最坏结局，自己吓自己。你缺乏安全感，常因小事心神不宁。建议：拒绝过度脑补，理性评估现实。"
    },{
        name:"责备他人",type:"消极性",
        simple:"习惯归因外界与他人，容易抱怨、不满。",
        rich:"你自尊心强，遇到问题习惯向外找原因，不易自卑，但易抱怨、觉得自己是受害者。建议：适当自我反思，减少抱怨，关注可控部分。"
    }
];

// 渲染题目
const qEl=document.getElementById("questions");
items.forEach((txt,i)=>{
    const card=document.createElement("div");
    card.className="q-card";
    card.innerHTML=`
        <div class="q-text">${i+1}. ${txt}</div>
        <div class="opts">
            ${[1,2,3,4,5].map(n=>`
                <input type="radio" name="q${i}" value="${n}" id="q${i}${n}">
                <label for="q${i}${n}">${n}</label>
            `).join("")}
        </div>
    `;
    qEl.appendChild(card);
});

// 基础页面跳转
function goPage(n){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page"+n).classList.add("active");
}

// 提交答题 + 触发撒花 + 计算结果
function submitAndShowResult(){
    let totalPos=0,totalNeg=0;
    dimInfo.forEach(d=>d.score=0);

    // 读取答题分数
    for(let i=0;i<18;i++){
        const v=document.querySelector(`input[name="q${i}"]:checked`)?.value;
        if(!v)return alert("请完成所有题目！");
        const dIndex=Math.floor(i/2);
        dimInfo[dIndex].score+=parseInt(v);
    }

    // 计算总分
    dimInfo.forEach(d=>{
        if(d.type==="积极性") totalPos+=d.score;
        else totalNeg+=d.score;
    });

    // 找到主导风格
    const topDim=dimInfo.reduce((a,b)=>a.score>b.score?a:b);
    const topIndex = dimInfo.findIndex(x=>x.name===topDim.name);

    // 填充页面数据
    document.getElementById("topStyleShow").innerText = topDim.name;
    document.getElementById("mainTypeShow").innerText = topDim.type+"主导";
    document.getElementById("totalType").innerText = totalPos>totalNeg 
        ? "积极性为主，情绪调节能力良好，抗压能力强" 
        : "消极性为主，容易产生情绪内耗，需注意调节";
    document.getElementById("posScore").innerText = totalPos;
    document.getElementById("negScore").innerText = totalNeg;

    // 专属深度解读（丰富版）
    document.getElementById("richExplain").innerHTML = `<strong>专属深度解读</strong>${topDim.rich}`;

    // 其他方式统一显示简易版
    let listHtml = "";
    dimInfo.forEach(item=>{
        listHtml += `
        <div class="hover-item">
            ${item.name}（${item.type}）
            <div class="hover-desc">${item.simple}</div>
        </div>
        `;
    });
    document.getElementById("allStyleList").innerHTML = listHtml;

    // 销毁旧图表，新建雷达图
    const ctx = document.getElementById('radarChart').getContext('2d');
    if(window.radarChartInstance) window.radarChartInstance.destroy();
    window.radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: dimInfo.map(d=>d.name),
            datasets: [{
                label: '你的得分（满分10分）',
                data: dimInfo.map(d=>d.score),
                backgroundColor: 'rgba(128, 79, 193, 0.25)',
                borderColor: 'rgba(128, 79, 193, 1)',
                borderWidth: 2,
                pointBackgroundColor: '#804fc1',
                pointRadius: 5
            },{
                label: '大众平均水平',
                data: Array(9).fill(5),
                backgroundColor: 'rgba(160, 160, 160, 0.1)',
                borderColor: 'rgba(160, 160, 160, 0.6)',
                borderWidth: 1.5,
                pointBackgroundColor: '#999',
                pointRadius: 3,
                borderDash: [6,6]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                r: {
                    angleLines: {color: 'rgba(0,0,0,0.12)'},
                    grid: {color: 'rgba(0,0,0,0.12)'},
                    pointLabels: {
                        font: {size: 12, family: "微软雅黑"},
                        color: '#333'
                    },
                    ticks: {
                        stepSize: 2,
                        max: 10,
                        min: 0,
                        color: '#666',
                        backdropColor: 'transparent'
                    }
                }
            },
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {font: {family: "微软雅黑", size: 13}}
                },
                tooltip: {
                    bodyFont: {family: "微软雅黑"},
                    callbacks: {
                        label: function(context) {
                            return `${context.dataset.label}：${context.raw} 分`;
                        }
                    }
                }
            }
        }
    });

    // 跳转页面 + 触发撒花动画
    goPage(3);
    confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.3 },
        colors: ['#804fc1','#a878e4','#fef5ff']
    });
}
</script>
</body>
</html>
